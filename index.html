<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morning Brain Dump</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Sky Background with Sun/Moon Animation -->
    <div class="sky-background">
        <div class="celestial-body"></div>
    </div>

    <div class="container">
        <header>
            <div class="header-top">
                <h1 id="greeting">Brain Clarity</h1>
                <div class="time-switcher">
                    <button class="time-btn" data-time="morning" title="Morning">
                        <span class="time-icon">🌅</span>
                    </button>
                    <button class="time-btn" data-time="day" title="Daytime">
                        <span class="time-icon">☀️</span>
                    </button>
                    <button class="time-btn" data-time="evening" title="Evening">
                        <span class="time-icon">🌙</span>
                    </button>
                </div>
            </div>
            <div class="input-section">
                <textarea id="brainDumpInput" placeholder="Take a moment to clear your mind... write whatever comes to you.

For example:
• Finish the report by Friday
• Gym session today, maybe 30 minutes of reading
• Coffee with Sarah at 3pm tomorrow
• Remember to pick up groceries"></textarea>
                <button id="parseDumpBtn">✨ Let's organize this</button>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="section">
                    <h2>✨ Daily Habits</h2>
                    <p class="section-subtitle">Small steps, big progress</p>
                    <div id="habitList" class="habit-list">
                        <!-- Habits will appear here -->
                    </div>
                </div>

                <div class="section">
                    <h2>📝 Tasks</h2>
                    <p class="section-subtitle">One thing at a time</p>
                    <div id="todoList" class="todo-list">
                        <!-- Tasks will appear here -->
                    </div>
                </div>
            </aside>

            <main class="calendar-section">
                <div class="calendar-header">
                    <button id="prevMonth">&lt;</button>
                    <h2 id="currentMonth"></h2>
                    <button id="nextMonth">&gt;</button>
                </div>
                <div class="calendar-grid" id="calendar">
                    <!-- Calendar will be generated here -->
                </div>
            </main>
        </div>

        <div class="history-section">
            <h3>💭 Your Previous Thoughts</h3>
            <p class="history-subtitle">It's okay to look back</p>
            <div id="dumpHistory" class="dump-history">
                <!-- History will appear here -->
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmationModal" class="modal">
        <div class="modal-content">
            <h2>✨ Let's organize your thoughts</h2>
            <p>Take your time reviewing these. You can adjust any categories that don't feel right.</p>
            <div id="parsedItems" class="parsed-items">
                <!-- Parsed items will appear here -->
            </div>
            <div class="modal-actions">
                <button id="confirmBtn" class="btn-primary">Looks good ✓</button>
                <button id="cancelBtn" class="btn-secondary">Not yet</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
