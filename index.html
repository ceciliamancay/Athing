<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morning Brain Dump</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Morning Brain Dump</h1>
            <div class="input-section">
                <textarea id="brainDumpInput" placeholder="Write your morning brain dump here...

Example:
Need to finish the report by Friday. Also gym today and remember to read for 30 mins.
Meeting with Sarah at 3pm tomorrow. Buy groceries. Start working on the project proposal next week."></textarea>
                <button id="parseDumpBtn">Parse & Add</button>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="section">
                    <h2>Habit Tracker</h2>
                    <div id="habitList" class="habit-list">
                        <!-- Habits will appear here -->
                    </div>
                </div>

                <div class="section">
                    <h2>To-Do List</h2>
                    <div id="todoList" class="todo-list">
                        <!-- Tasks will appear here -->
                    </div>
                </div>
            </aside>

            <main class="calendar-section">
                <div class="calendar-header">
                    <button id="prevMonth">&lt;</button>
                    <h2 id="currentMonth"></h2>
                    <button id="nextMonth">&gt;</button>
                </div>
                <div class="calendar-grid" id="calendar">
                    <!-- Calendar will be generated here -->
                </div>
            </main>
        </div>

        <div class="history-section">
            <h3>Brain Dump History</h3>
            <div id="dumpHistory" class="dump-history">
                <!-- History will appear here -->
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmationModal" class="modal">
        <div class="modal-content">
            <h2>Confirm Your Items</h2>
            <p>Review the parsed items and assign them to categories:</p>
            <div id="parsedItems" class="parsed-items">
                <!-- Parsed items will appear here -->
            </div>
            <div class="modal-actions">
                <button id="confirmBtn" class="btn-primary">Confirm All</button>
                <button id="cancelBtn" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
